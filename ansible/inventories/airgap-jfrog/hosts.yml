---
# Inventory: variant A of the two VM setup. One VM holds Ansible and JFrog, the other one
# Artifact Keeper. Both have a single network card without gateway and DNS.
#
# Groups
#   artifactory           JFrog with its database, installed by the role artifactory_oss
#   artifact_keeper_host  Artifact Keeper with database, search and proxy
#   migration_runner      runs the migration playbooks; must reach both
all:
  vars:
    ansible_user: rocky
  children:
    artifactory:
      hosts:
        air-jfrog:
          ansible_host: 192.168.56.30
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # A VM with 3 GB reports about 2700 MB, the kernel reserves the rest.
          standalone_host_min_memory_mb: 2500
          standalone_host_firewall_ports: []
          # This host serves the time to the other one.
          restricted_host_time_allow:
            - "{{ ak_cluster_network }}"
    artifact_keeper_host:
      hosts:
        air-ak:
          ansible_host: 192.168.56.31
          standalone_host_min_memory_mb: 3500
          standalone_host_firewall_ports:
            - 30080
          restricted_host_time_servers:
            - 192.168.56.30
    migration_runner:
      hosts:
        air-jfrog:
