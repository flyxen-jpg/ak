---
# Inventory: VirtualBox lab without internet access (NAT adapter removed, host-only network only).
# Everything is installed from the offline bundle on the control node (see docs/09-offline.md).
# Same topology as virtualbox-online; groups are described there.
all:
  children:
    ak_cluster:
      children:
        ak_app:
          hosts:
            ans-node1:
              ansible_host: 192.168.56.21
              keepalived_priority: 150
            ans-node2:
              ansible_host: 192.168.56.22
              keepalived_priority: 100
        ak_quorum:
          hosts:
            ans-node3:
              ansible_host: 192.168.56.23
