---
# Inventory TEMPLATE: air-gapped environment on any hypervisor or bare metal (not VirtualBox).
# Copy this directory, then adjust host names, IPs and group_vars/all/main.yml.
#
# Production recommendation: three full nodes in ak_app (no separate witness) if budget allows;
# the witness layout below is the minimum that still survives the loss of any single node.
all:
  children:
    ak_cluster:
      children:
        ak_app:
          hosts:
            ak01:
              ansible_host: 10.20.30.11
              keepalived_priority: 150
            ak02:
              ansible_host: 10.20.30.12
              keepalived_priority: 100
        ak_quorum:
          hosts:
            ak03:
              ansible_host: 10.20.30.13
  vars:
    # Account with passwordless sudo created during OS installation.
    ansible_user: ansible
