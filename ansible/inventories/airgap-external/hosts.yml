---
# Inventory: variant B of the two VM setup. JFrog runs on a server of its own that Ansible does
# not manage. It is only reached over the network with an account, see group_vars.
#
# Groups
#   artifactory           empty on purpose, the role artifactory_oss does not run
#   artifact_keeper_host  Artifact Keeper with database, search and proxy
#   migration_runner      runs the migration playbooks; must reach both
all:
  vars:
    ansible_user: rocky
  children:
    artifactory:
      hosts: {}
    control:
      hosts:
        air-ctl:
          ansible_host: 192.168.56.32
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          # Ansible only. Without a stack the VM needs little memory and disk space.
          standalone_host_min_memory_mb: 900
          standalone_host_min_free_gb: 8
          standalone_host_firewall_ports: []
          restricted_host_time_allow:
            - "{{ ak_cluster_network }}"
    artifact_keeper_host:
      hosts:
        air-ak:
          ansible_host: 192.168.56.31
          standalone_host_min_memory_mb: 3500
          standalone_host_firewall_ports:
            - 30080
          restricted_host_time_servers:
            - 192.168.56.32
    migration_runner:
      hosts:
        air-ctl:
