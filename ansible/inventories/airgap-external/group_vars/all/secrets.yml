---
# Indirection layer for secrets: readable variable names here, encrypted values in vault.yml.
# Create vault.yml with: tools/generate-vault.py inventories/airgap-external/group_vars/all/vault.yml
# then set vault_external_jfrog_password with: ansible-vault edit <file>
ak_standalone_db_password: "{{ vault_ak_standalone_db_password }}"
ak_standalone_admin_password: "{{ vault_artifact_keeper_admin_password }}"
ak_standalone_jwt_secret: "{{ vault_artifact_keeper_jwt_secret }}"
ak_standalone_webhook_secret_key: "{{ vault_artifact_keeper_webhook_secret_key }}"
ak_standalone_migration_encryption_key: "{{ vault_artifact_keeper_migration_encryption_key }}"
ak_standalone_sso_encryption_key: "{{ vault_artifact_keeper_sso_encryption_key }}"
artifactory_migration_ak_password: "{{ vault_artifact_keeper_admin_password }}"
artifactory_migration_rt_password: "{{ vault_external_jfrog_password }}"
