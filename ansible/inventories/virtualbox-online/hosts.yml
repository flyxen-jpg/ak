---
# Inventory: VirtualBox lab, nodes have internet access (NAT adapter).
# Packages come from the Rocky/EPEL/PGDG mirrors, images from the public registries.
#
# Groups
#   ak_cluster  all nodes: etcd, Garage (S3) and OpenSearch quorum members
#   ak_app      nodes running Artifact Keeper, PostgreSQL/Patroni, HAProxy and keepalived
#   ak_quorum   witness node: provides the third vote for etcd/Garage/OpenSearch only
all:
  children:
    ak_cluster:
      children:
        ak_app:
          hosts:
            ans-node1:
              ansible_host: 192.168.56.21
              keepalived_priority: 150
            ans-node2:
              ansible_host: 192.168.56.22
              keepalived_priority: 100
        ak_quorum:
          hosts:
            ans-node3:
              ansible_host: 192.168.56.23
