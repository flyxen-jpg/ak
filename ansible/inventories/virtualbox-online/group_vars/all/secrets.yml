---
# Indirection layer for secrets: readable variable names here, encrypted values in vault.yml.
# Create vault.yml with: tools/generate-vault.py inventories/<name>/group_vars/all/vault.yml
patroni_superuser_password: "{{ vault_patroni_superuser_password }}"
patroni_replication_password: "{{ vault_patroni_replication_password }}"
patroni_app_password: "{{ vault_patroni_app_password }}"
garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
garage_admin_token: "{{ vault_garage_admin_token }}"
garage_access_key_id: "{{ vault_garage_access_key_id }}"
garage_secret_access_key: "{{ vault_garage_secret_access_key }}"
keepalived_auth_pass: "{{ vault_keepalived_auth_pass }}"
artifact_keeper_admin_password: "{{ vault_artifact_keeper_admin_password }}"
artifact_keeper_jwt_secret: "{{ vault_artifact_keeper_jwt_secret }}"
artifact_keeper_webhook_secret_key: "{{ vault_artifact_keeper_webhook_secret_key }}"
artifact_keeper_migration_encryption_key: "{{ vault_artifact_keeper_migration_encryption_key }}"
artifact_keeper_sso_encryption_key: "{{ vault_artifact_keeper_sso_encryption_key }}"
