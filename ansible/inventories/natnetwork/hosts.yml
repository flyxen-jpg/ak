---
# Inventory: HA cluster on hand-installed Rocky Linux 10 minimal VMs that share one
# VirtualBox "NAT Network" (no bridged and no host-only adapters).
# A plain "NAT" adapter is not enough: each VM gets its own isolated NAT and the nodes could
# not reach each other. A NAT Network connects the VMs and still gives them internet access.
#
# Enter the addresses the nodes received by DHCP ("ip -br a" on each node). The bootstrap
# playbook then fixes them as static configuration.
#
# Groups
#   ak_cluster        all nodes: etcd, Garage (S3) and OpenSearch quorum members
#   ak_app            Artifact Keeper, PostgreSQL/Patroni, HAProxy and keepalived
#   ak_quorum         third vote for etcd/Garage/OpenSearch
#   artifactory       Artifactory OSS as migration source (optional, lab and migration only)
#   migration_runner  runs the migration playbooks; must reach the VIP and Artifactory
all:
  vars:
    # Administrator account created during the Rocky installation.
    ansible_user: rocky
  children:
    ak_cluster:
      children:
        ak_app:
          hosts:
            ak-ha1:
              ansible_host: 10.0.10.4
              keepalived_priority: 150
            ak-ha2:
              ansible_host: 10.0.10.5
              keepalived_priority: 100
        ak_quorum:
          hosts:
            ak-ha3:
              ansible_host: 10.0.10.6
    artifactory:
      hosts:
        ak-ha3:
    migration_runner:
      hosts:
        ak-ha3:
