---
# Inventory: ONE plain Rocky Linux 10 minimal host with NAT networking only.
# Ansible runs on that host itself (connection local): no second machine, no SSH keys,
# no host-only or bridged network. Typical use: a VirtualBox VM installed by hand from the
# minimal ISO, "NAT" as its only network adapter.
#
# To manage the host from another machine instead, replace ansible_connection with
# ansible_host / ansible_user (SSH must then be reachable, e.g. via NAT port forwarding).
all:
  children:
    standalone:
      hosts:
        rocky:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    # Host that runs the migration playbooks; it must reach both web interfaces.
    migration_runner:
      hosts:
        rocky:
