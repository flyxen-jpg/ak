---
- name: Create users (one-time password, change required at first login)
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/users"
    method: POST
    headers: "{{ artifactory_migration_ak_auth }}"
    body_format: json
    body:
      username: "{{ item.item }}"
      email: "{{ item.json.email }}"
      display_name: "{{ item.item }}"
      is_admin: false
    status_code: [200, 201]
  loop: "{{ artifactory_migration_src_user_details.results }}"
  loop_control:
    label: "{{ item.item }}"
  # Artifact Keeper requires an e-mail address; users without one are listed below.
  when:
    - item.item not in artifactory_migration_ak_users
    - item.json.email | default('') | length > 0
  register: artifactory_migration_new_users
  changed_when: true
  no_log: true

- name: Store the one-time passwords (root only)
  become: true
  ansible.builtin.lineinfile:
    path: "{{ artifactory_migration_password_file }}"
    line: "{{ item.item.item }} {{ item.json.generated_password }}"
    regexp: "^{{ item.item.item }} "
    create: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ artifactory_migration_new_users.results | selectattr('json', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.item }}"
  no_log: true

- name: Report users that could not be migrated
  ansible.builtin.debug:
    msg: >-
      No e-mail in Artifactory, not migrated:
      {{ artifactory_migration_src_user_details.results | rejectattr('json.email', 'defined') | map(attribute='item') | list }}
  when: artifactory_migration_src_user_details.results | rejectattr('json.email', 'defined') | list | length > 0

- name: Refresh user IDs
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/users?per_page=500"
    headers: "{{ artifactory_migration_ak_auth }}"
  register: artifactory_migration_target_users

- name: Remember user IDs
  ansible.builtin.set_fact:
    artifactory_migration_ak_users: "{{ artifactory_migration_target_users.json['items'] | items2dict(key_name='username', value_name='id') }}"

# Built-in "readers" group: grants read access to everything in Artifactory. It has no
# equivalent; read access must be granted explicitly in Artifact Keeper.
- name: Create groups
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/groups"
    method: POST
    headers: "{{ artifactory_migration_ak_auth }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      description: "{{ item.description | default('') }}"
    status_code: [200, 201]
  loop: "{{ artifactory_migration_src_lists.results[0].json.groups | rejectattr('name', 'equalto', 'readers') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in artifactory_migration_ak_groups
  changed_when: true

- name: Refresh group IDs
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/groups?per_page=500"
    headers: "{{ artifactory_migration_ak_auth }}"
  register: artifactory_migration_target_groups

- name: Remember group IDs
  ansible.builtin.set_fact:
    artifactory_migration_ak_groups: "{{ artifactory_migration_target_groups.json['items'] | items2dict(key_name='name', value_name='id') }}"

- name: Read current group members in Artifact Keeper
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/groups/{{ item.value }}"
    headers: "{{ artifactory_migration_ak_auth }}"
  loop: "{{ artifactory_migration_ak_groups | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: artifactory_migration_target_members

# Artifactory returns the groups of a user as objects ({"name": ...}) or plain names,
# depending on the version; both are handled.
- name: Collect group memberships from Artifactory
  ansible.builtin.set_fact:
    artifactory_migration_src_membership: >-
      {%- set m = {} -%}
      {%- for u in artifactory_migration_src_user_details.results -%}
      {%- for g in u.json.groups | default([]) -%}
      {%- set gname = g.name if g is mapping else g -%}
      {%- set _ = m.update({gname: m.get(gname, []) + [u.item]}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ m }}

- name: Add members to groups
  vars:
    artifactory_migration_wanted_ids: >-
      {{ artifactory_migration_src_membership[item.item.key] | default([]) | select('in', artifactory_migration_ak_users)
         | map('extract', artifactory_migration_ak_users) | list }}
    artifactory_migration_current_ids: >-
      {{ item.json.members | default([]) | map(attribute='user_id') | list }}
  ansible.builtin.uri:
    url: "{{ artifactory_migration_ak_url }}/api/v1/groups/{{ item.item.value }}/members"
    method: POST
    headers: "{{ artifactory_migration_ak_auth }}"
    body_format: json
    body:
      user_ids: "{{ artifactory_migration_wanted_ids | difference(artifactory_migration_current_ids) }}"
    status_code: [200, 201, 204]
  loop: "{{ artifactory_migration_target_members.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: artifactory_migration_wanted_ids | difference(artifactory_migration_current_ids) | length > 0
  changed_when: true
