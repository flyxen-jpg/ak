---
# Test data for the migration (lab only): repositories of every type, artifacts with
# properties, a remote cache, users, groups and permission targets.
# Every step checks the current state first, so the play can run repeatedly.

- name: Import login tasks
  ansible.builtin.import_tasks: login.yml

- name: Read existing repositories
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/artifactory/api/repositories"
    url_username: "{{ artifactory_migration_rt_user }}"
    url_password: "{{ artifactory_migration_rt_password }}"
    force_basic_auth: true
  register: artifactory_migration_rt_repos
  # The UI API of Artifactory occasionally stalls on single requests; retry instead of waiting long.
  until: artifactory_migration_rt_repos.status | default(0) == 200
  retries: 4
  delay: 5

- name: Remember existing repository keys
  ansible.builtin.set_fact:
    artifactory_migration_rt_repo_keys: "{{ artifactory_migration_rt_repos.json | map(attribute='key') | list }}"

- name: Create local repositories
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/ui/api/v1/ui/admin/repositories"
    method: POST
    headers: "{{ artifactory_migration_rt_ui }}"
    body_format: json
    body:
      type: localRepoConfig
      general:
        repoKey: "{{ item.key }}"
      basic:
        layout: "{{ item.layout }}"
        includesPattern: "**/*"
        excludesPattern: ""
      advanced:
        blackedOut: false
        allowContentBrowsing: false
        propertySets: []
      typeSpecific: "{{ {'repoType': item.package_type} | combine(item.type_specific) }}"
    # 409: already exists (also after a request that stalled but was processed).
    status_code: [200, 201, 409]
  loop: "{{ artifactory_migration_seed_local_repos }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key not in artifactory_migration_rt_repo_keys
  register: artifactory_migration_create
  until: artifactory_migration_create.status | default(0) in [200, 201, 409]
  retries: 4
  delay: 5
  changed_when: artifactory_migration_create.status in [200, 201]

- name: Create remote and virtual repositories
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/ui/api/v1/ui/admin/repositories"
    method: POST
    headers: "{{ artifactory_migration_rt_ui }}"
    body_format: json
    body: "{{ item }}"
    # 409: already exists (also after a request that stalled but was processed).
    status_code: [200, 201, 409]
  loop:
    - "{{ artifactory_migration_seed_remote_repo }}"
    - "{{ artifactory_migration_seed_virtual_repo }}"
  loop_control:
    label: "{{ item.general.repoKey }}"
  when: item.general.repoKey not in artifactory_migration_rt_repo_keys
  register: artifactory_migration_create
  until: artifactory_migration_create.status | default(0) in [200, 201, 409]
  retries: 4
  delay: 5
  changed_when: artifactory_migration_create.status in [200, 201]

- name: Create directory for test files
  become: true
  ansible.builtin.file:
    path: "{{ artifactory_migration_seed_dir }}"
    state: directory
    mode: "0755"

# Random content, generated once; dd needs no shell redirection.
- name: Generate test binaries
  become: true
  ansible.builtin.command: >-
    dd if=/dev/urandom of={{ artifactory_migration_seed_dir }}/{{ item.path | regex_replace('/', '_') }}
    bs=1024 count={{ item.kb }} status=none
  args:
    creates: "{{ artifactory_migration_seed_dir }}/{{ item.path | regex_replace('/', '_') }}"
  loop: "{{ artifactory_migration_seed_files | rejectattr('pom', 'defined') | list }}"
  loop_control:
    label: "{{ item.repo }}/{{ item.path }}"

# Artifactory parses uploaded POMs, so these must be valid XML.
- name: Generate test POMs
  become: true
  ansible.builtin.copy:
    dest: "{{ artifactory_migration_seed_dir }}/{{ item.path | regex_replace('/', '_') }}"
    content: |
      <project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId>
      <artifactId>{{ item.pom[0] }}</artifactId><version>{{ item.pom[1] }}</version><packaging>jar</packaging></project>
    mode: "0644"
  loop: "{{ artifactory_migration_seed_files | selectattr('pom', 'defined') | list }}"
  loop_control:
    label: "{{ item.repo }}/{{ item.path }}"

- name: Check which test files exist in Artifactory
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/artifactory/api/storage/{{ item.repo }}/{{ item.path }}"
    url_username: "{{ artifactory_migration_rt_user }}"
    url_password: "{{ artifactory_migration_rt_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  loop: "{{ artifactory_migration_seed_files }}"
  loop_control:
    label: "{{ item.repo }}/{{ item.path }}"
  register: artifactory_migration_seed_present

# Properties are passed as matrix parameters (;key=value), as build tools do.
- name: Upload missing test files
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/artifactory/{{ item.item.repo }}/{{ item.item.path }}{{ item.item.props }}"
    method: PUT
    src: "{{ artifactory_migration_seed_dir }}/{{ item.item.path | regex_replace('/', '_') }}"
    # The files were generated on the runner, which is not the control node in a cluster.
    remote_src: true
    url_username: "{{ artifactory_migration_rt_user }}"
    url_password: "{{ artifactory_migration_rt_password }}"
    force_basic_auth: true
    status_code: [201]
  loop: "{{ artifactory_migration_seed_present.results }}"
  loop_control:
    label: "{{ item.item.repo }}/{{ item.item.path }}"
  when: item.status == 404
  changed_when: true

- name: Fill the remote cache through the virtual repository
  ansible.builtin.uri:
    url: "{{ artifactory_migration_rt_url }}/artifactory/maven-all/{{ item }}"
    url_username: "{{ artifactory_migration_rt_user }}"
    url_password: "{{ artifactory_migration_rt_password }}"
    force_basic_auth: true
  loop: "{{ artifactory_migration_seed_remote_paths }}"

- name: Import security seed tasks
  ansible.builtin.import_tasks: seed_security.yml
