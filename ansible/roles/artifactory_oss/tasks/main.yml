---
- name: Verify that the secrets are defined
  ansible.builtin.assert:
    that:
      - artifactory_oss_db_password | length >= 12
      - artifactory_oss_admin_password | length >= 12
    fail_msg: artifactory_oss_db_password and artifactory_oss_admin_password (12+ characters) must be set.
    quiet: true
  no_log: true

- name: Open the web port
  become: true
  ansible.posix.firewalld:
    zone: "{{ item }}"
    port: "{{ artifactory_oss_http_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ artifactory_oss_firewall_zones }}"

- name: Provide container images
  ansible.builtin.include_role:
    name: podman
    tasks_from: image.yml
  vars:
    podman_image: "{{ item }}"
  loop:
    - "{{ artifactory_oss_postgres_image }}"
    - "{{ artifactory_oss_image }}"

- name: Create configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ artifactory_oss_config_dir }}"
    state: directory
    owner: root
    group: "{{ podman_user }}"
    mode: "0750"

- name: Write environment files
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ artifactory_oss_config_dir }}/{{ item }}"
    owner: root
    group: "{{ podman_user }}"
    mode: "0640"
  loop:
    - postgres.env
    - artifactory.env
  notify: Restart artifactory

- name: Install Quadlet units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - artifactory.network
    - artifactory-postgres.container
    - artifactory.container
  notify: Restart artifactory

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Start Artifactory
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    scope: user
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  loop: "{{ artifactory_oss_units }}"

# Order of a start as measured in the lab: the router first, then all services, directly after
# that the REST API and the registry. The router alone says nothing about the others, so the
# wait covers all of them. Short timeouts keep a stalled request from eating the waiting time.
- name: Wait until all services report healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ artifactory_oss_http_port }}/router/api/v1/system/health"
    return_content: true
    timeout: 5
  register: artifactory_oss_health
  until:
    - artifactory_oss_health.status | default(0) == 200
    - artifactory_oss_health.json.router.state | default('') == 'HEALTHY'
    - artifactory_oss_health.json.services | default([]) | length > 0
    - artifactory_oss_health.json.services | default([]) | rejectattr('state', 'equalto', 'HEALTHY') | list | length == 0
  retries: "{{ artifactory_oss_wait_retries }}"
  delay: "{{ artifactory_oss_wait_delay }}"

- name: Wait until the REST API answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ artifactory_oss_http_port }}/artifactory/api/system/ping"
    return_content: true
    timeout: 5
  register: artifactory_oss_ping
  until: artifactory_oss_ping.content | default('') == 'OK'
  retries: "{{ artifactory_oss_wait_retries }}"
  delay: "{{ artifactory_oss_wait_delay }}"

- name: Import admin password tasks
  ansible.builtin.import_tasks: admin_password.yml

- name: Import license agreement tasks
  ansible.builtin.import_tasks: eula.yml
  when: artifactory_oss_edition == 'artifactory-jcr'

# With JFConnect enabled the login stalls for 180 seconds after every start (see defaults).
# Waiting here with a short timeout means later tasks need no long timeouts. REST API and
# registry are not affected, so this can be skipped when only they count.
- name: Wait until the login of the web interface answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ artifactory_oss_http_port }}/ui/api/v1/ui/auth/login"
    method: POST
    body_format: json
    body:
      user: "{{ artifactory_oss_admin_user }}"
      password: "{{ artifactory_oss_admin_password }}"
      type: login
    headers:
      X-Requested-With: XMLHttpRequest
    timeout: 8
  register: artifactory_oss_ui_login
  until: artifactory_oss_ui_login.status | default(0) == 200
  retries: "{{ artifactory_oss_wait_retries }}"
  delay: "{{ artifactory_oss_wait_delay }}"
  no_log: true
  when: artifactory_oss_wait_for_ui | bool
