---
# Replaces the well-known default admin password.
# OSS specifics (found in the lab): the Access API (/access/api/v2/...) rejects basic
# authentication, and anonymous read access makes most endpoints answer 200 for any password.
# /api/storageinfo needs admin rights and therefore really checks the credentials;
# /api/security/users/authorization/changePassword is the self-service call that works in OSS.

- name: Check whether the configured admin password is active
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ artifactory_oss_http_port }}/artifactory/api/storageinfo"
    url_username: "{{ artifactory_oss_admin_user }}"
    url_password: "{{ artifactory_oss_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 60
  register: artifactory_oss_login_new
  no_log: true

- name: Change the default admin password
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ artifactory_oss_http_port }}/artifactory/api/security/users/authorization/changePassword"
    method: POST
    url_username: "{{ artifactory_oss_admin_user }}"
    url_password: "{{ artifactory_oss_default_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      userName: "{{ artifactory_oss_admin_user }}"
      oldPassword: "{{ artifactory_oss_default_admin_password }}"
      newPassword1: "{{ artifactory_oss_admin_password }}"
      newPassword2: "{{ artifactory_oss_admin_password }}"
    timeout: 60
  register: artifactory_oss_password_change
  when: artifactory_oss_login_new.status == 401
  changed_when: true
  # Evaluated in the next task with an explanation instead of the hidden (no_log) response.
  failed_when: false
  no_log: true

- name: Explain a failed password change
  ansible.builtin.assert:
    that: artifactory_oss_password_change is skipped or artifactory_oss_password_change.status == 200
    fail_msg: >-
      Neither the vault password nor the default password is valid for {{ artifactory_oss_admin_user }}
      (HTTP {{ artifactory_oss_password_change.status | default('?') }}). Set artifactory_oss_admin_password to the current password.
    quiet: true
