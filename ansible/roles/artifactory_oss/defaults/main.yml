---
# JFrog Artifactory OSS with its own PostgreSQL as rootless Podman Quadlets.
# Based on the official compose bundle (templates/docker-compose-volumes.yaml).
artifactory_oss_version: 7.161.26
# artifactory-oss (Community Edition) or artifactory-jcr (JFrog Container Registry).
artifactory_oss_edition: artifactory-oss
artifactory_oss_registry: releases-docker.jfrog.io
artifactory_oss_image: "{{ artifactory_oss_registry }}/jfrog/{{ artifactory_oss_edition }}:{{ artifactory_oss_version }}"
artifactory_oss_postgres_image: "{{ artifactory_oss_registry }}/postgres:17.10-alpine"

# JFrog Container Registry shows a license agreement before it can be used. Accepting it is a
# decision of the operator, so the role does it only when this is set to true.
artifactory_oss_accept_eula: false

# Router port: web UI, REST API and repositories (http://<host>:8082/artifactory/...).
artifactory_oss_http_port: 8082

# Own container network with a fixed address for Artifactory. Other stacks (the Artifact
# Keeper backend as migration client) can join it and allow exactly this address.
artifactory_oss_network: artifactory
artifactory_oss_subnet: 10.89.41.0/24
artifactory_oss_ip: 10.89.41.10

artifactory_oss_config_dir: /etc/artifactory

# Memory profile for test systems, measured in docs/14-jfrog-tuning.md. A VM with 3 GB is enough
# for evaluation and migration tests. Production installations use the defaults of JFrog, so
# set artifactory_oss_small to false there and size the heap with artifactory_oss_java_opts.
# JFrog runs five JVMs. Without a limit four of them take 25 percent of the memory each.
artifactory_oss_small: true
# Compiling with C1 only saves memory and start time and costs throughput under long load.
artifactory_oss_jvm_small: "-XX:TieredStopAtLevel=1 -Xss512k"
# Artifactory and jfbus have -XX:+UseG1GC fixed in their start scripts. A second collector such
# as SerialGC makes the JVM refuse to start, so these two limit the threads of G1 instead.
artifactory_oss_java_opts: >-
  {{ '-Xms256m -Xmx640m -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m '
     ~ artifactory_oss_jvm_small if artifactory_oss_small | bool else '-Xms512m -Xmx2g' }}
artifactory_oss_access_java_opts: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=48m {{ artifactory_oss_jvm_small }}"
artifactory_oss_jfbus_java_opts: "-Xms32m -Xmx96m -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1 -XX:ReservedCodeCacheSize=32m {{ artifactory_oss_jvm_small }}"
artifactory_oss_helper_java_opts: "-Xms32m -Xmx96m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=32m {{ artifactory_oss_jvm_small }}"

# The free editions contain no JFConnect service, yet the frontend asks it for entitlements for
# three minutes after every start, and the login of the web interface waits for that. Switching
# it off removes this wait. Licensed editions fetch their entitlements through JFConnect, so
# keep it enabled there (air-gapped: jfconnect.airgap.enabled, see the documentation of JFrog).
artifactory_oss_jfconnect_enabled: false

# Further settings of the JFrog services as environment variables.
artifactory_oss_extra_env: {}

# Waiting for a start: attempts and seconds between them, for each step of the wait.
artifactory_oss_wait_retries: 90
artifactory_oss_wait_delay: 5
# Wait for the login of the web interface too. The migration of rights needs it.
artifactory_oss_wait_for_ui: true

# Artifactory starts with admin / "password". The role replaces it with
# artifactory_oss_admin_password (vault) right after the first start.
artifactory_oss_admin_user: admin
artifactory_oss_default_admin_password: password

# Required secrets (vault): artifactory_oss_db_password, artifactory_oss_admin_password.

# firewalld zones in which the web port is opened (cluster nodes: the cluster zone).
artifactory_oss_firewall_zones:
  - public

artifactory_oss_units:
  - artifactory-postgres
  - artifactory
