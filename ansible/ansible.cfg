# Project-local Ansible configuration.
# Ansible picks this file up automatically when commands are run from this directory,
# so every operator gets the same behaviour regardless of their personal ~/.ansible.cfg.

[defaults]
# No default inventory on purpose: the target environment must always be chosen
# explicitly with -i, which prevents running a lab playbook against production.
roles_path = roles
# Collections are installed into the project (requirements.yml), not system-wide.
# This keeps the control node clean ("only ansible-core installed") and works offline.
collections_path = collections
remote_user = rocky
forks = 10
interpreter_python = auto_silent
# Human-readable task output.
callback_result_format = yaml
# Templates start with "# {{ ansible_managed }}" (default text "Ansible managed").
# Not customised here: the ansible_managed config option is deprecated in newer ansible-core.
# Fact caching keeps re-runs fast; facts are refreshed after 1 hour.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 3600
retry_files_enabled = false

[privilege_escalation]
# Privilege escalation is requested per task (become: true), never globally.
become = false

[ssh_connection]
# Pipelining sends modules over stdin instead of temp files. It is faster and lets
# tasks switch to the unprivileged container user without needing POSIX ACLs.
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
